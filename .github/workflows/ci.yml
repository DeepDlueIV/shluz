name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate routing
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Identify backend changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_scope.py >> "$GITHUB_OUTPUT"

  test:
    needs: scope
    # При проблеме определения области не показываем ложный зелёный пропуск.
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.backend != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Require a valid scope result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = 'success'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Verify database migration
        env:
          SHLUZ_DATABASE_URL: sqlite+pysqlite:///./migration-test.db
        run: alembic upgrade head

      - name: Test
        run: pytest -v

      - name: Build Docker image
        run: docker build -t shluz:ci .

      - name: Start Docker container
        run: |
          docker run --detach \
            --name shluz-ci \
            --publish 127.0.0.1:18000:8000 \
            --env SHLUZ_BOOTSTRAP_API_TOKEN=ci-token \
            --env SHLUZ_ADMIN_PASSWORD=ci-admin-password \
            --env SHLUZ_ACTIVE_PROVIDER=mock \
            shluz:ci

      - name: Verify Docker runtime
        run: |
          for attempt in $(seq 1 45); do
            health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' shluz-ci)"
            if [ "$health" = "healthy" ]; then
              break
            fi
            if [ "$health" = "unhealthy" ]; then
              echo "Container reported unhealthy status"
              exit 1
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "Container did not become healthy in time"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18000/health \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "ok"'

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ci-token" \
            --header "Content-Type: application/json" \
            --data '{"model":"mock-chat","messages":[{"role":"user","content":"docker smoke"}]}' \
            http://127.0.0.1:18000/v1/chat/completions \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data["choices"][0]["message"]["content"] == "Shluz mock reply: docker smoke"'

      - name: Print Docker logs on failure
        if: failure()
        run: docker logs shluz-ci || true

      - name: Stop Docker container
        if: always()
        run: docker rm --force shluz-ci || true
