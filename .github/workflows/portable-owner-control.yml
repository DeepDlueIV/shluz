name: NoClip portable control candidate

on:
  push:
    branches:
      - feat/unified-portable-control-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows portable safety tests
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest tests/launcher -q --noconftest
      - name: Windows entry syntax and portable path
        shell: pwsh
        run: |
          if (-not (Test-Path launcher/NoClip.cmd)) { throw "Missing entrypoint" }
          if (-not (Select-String -Path launcher/NoClip.cmd -Pattern 'SHLUZ_HOME=%~dp0' -SimpleMatch)) { throw "Missing portable environment" }

  linux:
    name: Python, CLI and Mini App regressions
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint portable code
        run: ruff check launcher/miniapp_live.py launcher/owner_control.py launcher/miniapp_trial.py launcher/updater.py scripts/package_owner_control.py tests/launcher
      - name: Portable and original launcher regressions
        run: python -m pytest tests/launcher -q --noconftest
      - name: Telegram panel authorization regressions
        run: python -m pytest tests/telegram/test_miniapp.py -q

  docker:
    name: Real Docker SQLite and new bot container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated local image (no real secrets)
        run: docker build --platform linux/amd64 -t noclip-portable-smoke:local .
      - name: Test existing volumes, backup, permanent Mini App mode and stopping
        run: python scripts/miniapp_live_docker_smoke.py

  package:
    name: Verified ZIP for Windows, no secrets
    needs: [windows, linux, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable tested Mini App manifest only
        env:
          PIN: ceac07cc88401dd99315a368a52d1c24f4f5d697
        run: |
          curl -fLsS --retry 3 --max-time 60 \
            "https://github.com/DeepDlueIV/shluz/releases/download/miniapp-test-$PIN/manifest.json" \
            -o pinned-miniapp-manifest.json
      - name: Verify pinned manifest and package one portable launcher
        run: python scripts/package_owner_control.py dist/NoClip-SHLUZ-Portable.zip pinned-miniapp-manifest.json
      - name: Verify ZIP SHA256 checksum
        run: cd dist && sha256sum -c NoClip-SHLUZ-Portable.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NoClip-SHLUZ-Portable-Windows
          path: |
            dist/NoClip-SHLUZ-Portable.zip
            dist/NoClip-SHLUZ-Portable.sha256
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Separate portable pre-release (no preview deployment)
    needs: [package]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'DeepDlueIV/shluz' &&
      github.ref == 'refs/heads/feat/unified-portable-control-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NoClip-SHLUZ-Portable-Windows
          path: dist
      - name: Verify ZIP before release
        run: cd dist && sha256sum -c NoClip-SHLUZ-Portable.sha256
      - name: Publish immutable owner candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="noclip-portable-${GITHUB_SHA}"
          gh release create "$TAG" \
            dist/NoClip-SHLUZ-Portable.zip \
            dist/NoClip-SHLUZ-Portable.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "NoClip unified portable — ${GITHUB_SHA:0:10}" \
            --notes "Owner-only local candidate. One-click NoClip.cmd starts Gateway and Telegram Mini App mode with the existing bot token and history volume. Classic bot remains stopped for rollback. No Docker volumes are deleted. Release contains no user data or secrets. Windows, Linux and isolated Docker tests passed. Live HTTPS/Telegram and owner Windows machine still require acceptance. Not production, not ordinary preview or main."
