name: Apply verified Telegram onboarding patch

on:
  push:
    branches: [implementation/telegram-beta-complete]
    paths: [.github/workflows/apply-telegram-onboarding.yml]

permissions:
  contents: write

jobs:
  apply-tested-source:
    if: github.repository == 'DeepDlueIV/shluz' && github.ref == 'refs/heads/implementation/telegram-beta-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard baseline and restore checksum-verified source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = "00d545e0996dff3dca6bbdf900629821ff6278a0"
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          chunks = []
          for sha in ('902f4a3e5b7b9b21441c8a5aa2bcbb6889d9f4c1', '2ae6a43af771fe37945c8b0ab4b93b45eed9fc22', 'b6f595128a28e42282eb0027b55c7ad62c4f6e28'):
              request = urllib.request.Request('https://api.github.com/repos/DeepDlueIV/shluz/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  chunks.append(base64.b64decode(json.load(response)['content']))
          patch = lzma.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ee99900086e647b020eb4e67f0952b288266212ee9000dceb0fd3e39f1a36864'
          pathlib.Path('/tmp/shluz-onboarding.patch').write_bytes(patch)
          PY
          git apply --check /tmp/shluz-onboarding.patch
          git apply --index /tmp/shluz-onboarding.patch
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 1; fi
      - name: Install isolated dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify complete test suite and lint before publishing
        run: |
          ruff check .
          pytest -q
      - name: Commit source to the existing feature branch without force
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(telegram): automatic invitation and approval onboarding without per-user files'
          git push origin HEAD:implementation/telegram-beta-complete
