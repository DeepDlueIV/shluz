name: Verify navigation and draft source

on:
  pull_request:
    branches: [implementation/telegram-beta-complete]

permissions:
  contents: read

jobs:
  verify-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/telegram-navigation-drafts'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct hash-verified application source
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'https://api.github.com/repos/DeepDlueIV/shluz'
          headers = {'Authorization': 'Bearer ' + os.environ['SOURCE_TOKEN'], 'Accept': 'application/vnd.github+json'}
          sha = '5d00db2aa25d9348b7b1bf5da235bcec7e5e4de0'
          request = urllib.request.Request(repo + '/git/blobs/' + sha, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              encoded = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(f'blob {len(encoded)}\0'.encode() + encoded).hexdigest() == sha
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '85b2ab623889c66313558eaf3fd4df8ffedfa078a72d0d7749d60ad4781f444d'
          path = pathlib.Path('/tmp/navigation.patch'); path.write_bytes(patch)
          subprocess.run(['git','worktree','add','--detach','/tmp/verified-source','14d5781a5dfae2e56f58ddafaa2c8a4adf37b7d5'], check=True)
          subprocess.run(['git','apply','--index',str(path)], cwd='/tmp/verified-source', check=True)
          tree = subprocess.check_output(['git','write-tree'], cwd='/tmp/verified-source').decode().strip()
          assert tree == 'e688aadc6bc0500605b8482c4228d970b8b1c47b', tree
          print('Verified source tree:', tree)
          PY
      - name: Test exact application tree
        working-directory: /tmp/verified-source
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest -q | tee /tmp/navigation-tests.log
      - name: Publish immutable verified source objects only
        working-directory: /tmp/verified-source
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'https://api.github.com/repos/DeepDlueIV/shluz'
          headers = {'Authorization': 'Bearer ' + os.environ['SOURCE_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def post(path, payload):
              req = urllib.request.Request(repo + path, headers=headers, data=json.dumps(payload).encode(), method='POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          paths = subprocess.check_output(['git','diff','--cached','--name-only','HEAD']).decode().splitlines()
          assert len(paths) == 9
          entries = []
          for path in paths:
              assert path.startswith(('telegram_bot/', 'tests/telegram/')) or path == 'docs/telegram-interface.md'
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              obj = post('/git/blobs', {'encoding':'base64','content':base64.b64encode(data).decode()})
              assert obj['sha'] == expected
              entries.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          result = post('/git/trees', {'base_tree':'e20a83dece31c219d88c130f99d1425428a7c24a','tree':entries})
          assert result['sha'] == 'e688aadc6bc0500605b8482c4228d970b8b1c47b'
          out = pathlib.Path('/tmp/navigation-verified'); out.mkdir()
          (out/'objects.json').write_text(json.dumps({'tree':result['sha'],'entries':entries},indent=2))
          (out/'tests.log').write_bytes(pathlib.Path('/tmp/navigation-tests.log').read_bytes())
          print('Published immutable tree:', result['sha'])
          print('No refs, deployments, provider settings or real databases changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-verified-source
          path: /tmp/navigation-verified
          retention-days: 7
