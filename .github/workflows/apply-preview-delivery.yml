name: Apply verified preview delivery
on:
  push:
    branches: [implementation/telegram-beta-complete]
    paths: [.github/workflows/apply-preview-delivery.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'DeepDlueIV/shluz'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/telegram-beta-complete
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact source after checking the baseline and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = dc0dca68652cf36f3acf3f4a4f6ae6cd049adf2d
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          chunks = []
          for sha in ['8501a0b62998a9e9d66979d8f060a2506eac836d', '6f0acadf76c8e52ab72da6bc59ff4851eb440953', 'c29dcfae25878b7c82dcee85daab4f8e1ca49cd8']:
              request = urllib.request.Request('https://api.github.com/repos/DeepDlueIV/shluz/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              assert payload['encoding'] == 'base64'
              chunk = base64.b64decode(payload['content'])
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == sha
              chunks.append(chunk)
          packed = b''.join(chunks)
          assert hashlib.sha256(packed).hexdigest() == 'c8e4639703cad0b5518b92792a4ab185b403f4952ee0b5785248b895d9125446'
          patch = Path('/tmp/shluz-preview.patch')
          patch.write_bytes(lzma.decompress(packed))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          PY
          git rm .github/workflows/apply-preview-delivery.yml
          git add -A
          test "$(git write-tree)" = 29e65b1b9ea09c5436e7bf9d5a6e3f7fd790769a
      - name: Check implementation before committing
        run: |
          python -m pip install -e '.[dev]'
          ruff check .
          pytest -q
      - name: Commit without overwriting parallel work
        run: |
          git fetch origin implementation/telegram-beta-complete
          test "$(git rev-parse origin/implementation/telegram-beta-complete)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: preview launcher, lifetime demo, server-side model rights and usage'
          git push origin HEAD:implementation/telegram-beta-complete
