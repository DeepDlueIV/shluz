name: Verify single-panel source

on:
  pull_request:
    branches: [implementation/telegram-beta-complete]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/telegram-single-panel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore checked patch into isolated source tree
        env:
          TRANSFER_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = '853893a78c51e41a20fadd6f22c984d99b34ea78'
          sha = '0a007f36864aed392449d2ec9c2c4113bb10e3e7'
          url = 'https://api.github.com/repos/DeepDlueIV/shluz/git/blobs/' + sha
          headers = {'Authorization': 'Bearer ' + os.environ['TRANSFER_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              raw = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == sha
          compressed = base64.b64decode(raw, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'd6d0d3664b2bc9116486bbee5cab5ff3640825748390e0d117d7670acd95c830'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'dbfa2df79e355778c49f17d6f5d7c9fedf8989a032185d5fb8dbf79aecf6c7c2'
          path = pathlib.Path('/tmp/panel.patch'); path.write_bytes(patch)
          subprocess.run(['git','worktree','add','--detach','/tmp/panel-source',base],check=True)
          subprocess.run(['git','apply','--index',str(path)],cwd='/tmp/panel-source',check=True)
          tree = subprocess.check_output(['git','write-tree'],cwd='/tmp/panel-source').decode().strip()
          assert tree == 'e20a83dece31c219d88c130f99d1425428a7c24a', tree
          print('Exact source verified:', tree)
          PY
      - name: Lint and full regression on actual source
        working-directory: /tmp/panel-source
        shell: bash
        env:
          VENICE_API_KEY: ''
          SHLUZ_VENICE_API_KEY: ''
          SHLUZ_ACTIVE_PROVIDER: mock
        run: |
          python -m pip install -e '.[dev]'
          ruff check .
          pytest -q | tee /tmp/panel-tests.log
      - name: Store immutable application objects without changing branches
        working-directory: /tmp/panel-source
        shell: bash
        env:
          TRANSFER_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'https://api.github.com/repos/DeepDlueIV/shluz'
          headers = {'Authorization': 'Bearer ' + os.environ['TRANSFER_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def post(path, data):
              request = urllib.request.Request(repo + path, data=json.dumps(data).encode(), headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          paths = subprocess.check_output(['git','diff','--cached','--name-only','853893a78c51e41a20fadd6f22c984d99b34ea78']).decode().splitlines()
          expected = {'docs/GATEWAY_NEXT_STEPS.md', 'docs/GO_LIVE_CHECKLIST.md', 'docs/VENICE_FIRST_LIVE_TEST.md', 'docs/telegram-interface.md', 'telegram_bot/controller.py', 'telegram_bot/delivery.py', 'telegram_bot/storage.py', 'tests/telegram/test_bot.py', 'tests/telegram/test_single_panel.py'}
          assert set(paths) == expected
          entries = []
          for path in paths:
              raw = pathlib.Path(path).read_bytes()
              sha = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              result = post('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(raw).decode()})
              assert result['sha'] == sha
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          result = post('/git/trees', {'base_tree': '4b101caa07c313b3313ff2cbda2c9d4617e382e5', 'tree': entries})
          assert result['sha'] == 'e20a83dece31c219d88c130f99d1425428a7c24a'
          out = pathlib.Path('/tmp/panel-verified'); out.mkdir()
          (out / 'objects.json').write_text(json.dumps({'tree': result['sha'], 'entries': entries}, indent=2))
          (out / 'tests.log').write_bytes(pathlib.Path('/tmp/panel-tests.log').read_bytes())
          print('Verified immutable tree:', result['sha'])
          print('No refs, releases, databases or provider settings changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: panel-verified-source
          path: /tmp/panel-verified/
          retention-days: 7
