name: Telegram development verification
on:
  push:
    branches: [implementation/telegram-beta-complete]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare reproducible offline source and tools
        run: |
          mkdir -p verification/wheels
          git archive --format=tar HEAD > verification/source.tar
          python -m pip download --no-deps --dest verification/wheels 'aiogram>=3.15,<4' 'magic-filter>=1,<2' 'aiofiles>=23,<26' 'ruff>=0.9,<1'
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-verification-workspace
          path: verification/
          retention-days: 1
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Baseline test suite
        run: pytest -q
