name: Prepare web video compatibility
on:
  push:
    branches: ['fix/web-english-motion-20261021']
    paths: ['.github/workflows/web-prepare-media.yml']
permissions:
  contents: write
jobs:
  webm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-english-motion-20261021
      - name: Prepare silent VP9 variants
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          for size in desktop mobile; do
            ffmpeg -hide_banner -loglevel error -y -i "web/public/media/hero-$size.mp4" -an -c:v libvpx-vp9 -b:v 0 -crf 36 -deadline good -cpu-used 4 -row-mt 1 -threads 4 -pix_fmt yuv420p "web/public/media/hero-$size.webm"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,duration -of json "web/public/media/hero-$size.webm"
          done
      - name: Save generated media only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/media/hero-desktop.webm web/public/media/hero-mobile.webm
          git diff --cached --quiet && exit 0
          git commit -m 'fix(web): add VP9 video sources for codec compatibility'
          git push origin HEAD:fix/web-english-motion-20261021
