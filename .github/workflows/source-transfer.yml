name: Verified source object transfer
on:
  push:
    branches: ['automation/verified-source-transfer-20261020']
    paths: ['.github/workflows/source-transfer.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c582a5335d6e17f6f33534a8b716cc1efbc076a
          persist-credentials: false
      - name: Upload exact single-line browser test correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          path = pathlib.Path('ui_tests/test_admin_ui.py')
          original = path.read_bytes()
          blob = lambda data: hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob(original) == '3a1674ef46b98b717ae6a031eb5ea9b9b8cd27d1'
          before = '    page.locator(\'form[action="/admin/plans"]\').get_by_label("Способ оплаты").select_option("payg")'
          after = '    create_form.get_by_label("Способ оплаты", exact=True).select_option("payg")'
          text = original.decode()
          assert text.count(before) == 1
          data = text.replace(before, after).encode()
          expected = 'cd1b01c368ba7032360b64c3a99d3eeffa4da8c4'
          assert blob(data) == expected
          request = urllib.request.Request(
              'https://api.github.com/repos/DeepDlueIV/shluz/git/blobs',
              data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as reply:
              result = json.load(reply)
          assert result['sha'] == expected
          print('Verified immutable browser-test blob: '+expected)
          print('No application ref, secret or runtime changed.')
          PY
