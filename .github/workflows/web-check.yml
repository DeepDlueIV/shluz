name: Web checks
on:
  push:
    paths: ['web/**', '.github/workflows/web-check.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-check.yml']
permissions:
  contents: write
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Import pinned brand assets on the review branch
        if: (github.ref == 'refs/heads/fix/web-hero-toolbar-20261021' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/web-hero-toolbar-20261021')) && hashFiles('web/scripts/prepare-brand-assets.py') != ''
        run: |
          python3 scripts/prepare-brand-assets.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/models public/licenses/lobe-icons-MIT.txt src/components/LandingSections.tsx src/components/LandingSections.module.css scripts/browser-check.mjs
          git rm scripts/prepare-brand-assets.py
          git commit -m 'assets(web): restore mapped model marks and clean provider references'
          git push origin HEAD:fix/web-hero-toolbar-20261021
      - name: Archive source for review
        run: tar -czf ../web-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: web-source
          path: web-source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_GATEWAY_ENABLED: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Browser regression checks
        run: |
          npm install --prefix "$RUNNER_TEMP/noclip-browser" --no-save --package-lock=false playwright@1.56.1
          ln -s "$RUNNER_TEMP/noclip-browser/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/noclip-browser/node_modules/.bin/playwright" install --with-deps chromium
          npm run start > /tmp/noclip-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/video-diagnostics.mjs
          node scripts/browser-check.mjs
          node scripts/hero-interaction-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-review
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
