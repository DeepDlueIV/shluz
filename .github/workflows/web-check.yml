name: Web checks

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Archive source for review
        run: tar -czf ../web-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: web-source
          path: web-source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_GATEWAY_ENABLED: 'false'
      - name: Browser regression checks
        if: hashFiles('web/scripts/browser-check.mjs') != ''
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run start > /tmp/noclip-web.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          node scripts/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-review
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
