name: Web checks

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Archive source for review
        run: tar -czf ../web-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: web-source
          path: web-source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_GATEWAY_ENABLED: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Browser regression checks
        run: |
          npm install --prefix "$RUNNER_TEMP/noclip-browser" --no-save --package-lock=false playwright@1.56.1
          ln -s "$RUNNER_TEMP/noclip-browser/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/noclip-browser/node_modules/.bin/playwright" install --with-deps chromium
          npm run start > /tmp/noclip-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/video-diagnostics.mjs
          node scripts/browser-check.mjs
          node scripts/hero-interaction-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-review
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
