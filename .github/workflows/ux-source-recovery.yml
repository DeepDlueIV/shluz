name: Recover saved UX source
on:
  push:
    branches: [implementation/telegram-beta-complete]
    paths: [.github/workflows/ux-source-recovery.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1a920db6b509acb0e2e71782a004333fe0b023ad
      - run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: saved-ux-source
          path: source.tar
          retention-days: 1
