name: Import pinned web icons
on:
  push:
    branches: ['fix/web-composer-polish-20261021']
    paths:
      - '.github/workflows/web-import-icons.yml'
      - 'web/scripts/import-model-icons.py'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate SVG assets
        run: python3 web/scripts/import-model-icons.py
      - name: Commit only imported assets and attribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/media/models web/public/licenses/lobe-icons-MIT.txt docs/web-icon-sources.md
          if ! git diff --cached --quiet; then
            git commit -m 'assets(web): add attributed brand icons from pinned LobeHub revision'
            git pull --rebase origin fix/web-composer-polish-20261021
            git push origin HEAD:fix/web-composer-polish-20261021
          fi
