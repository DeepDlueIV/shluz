name: Import web model icons
on:
  push:
    branches: ['fix/web-hero-toolbar-20261021']
    paths: ['.github/workflows/web-import-icons.yml']
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate pinned static SVGs
        env:
          ICON_REV: 21b2144f4ebe87ead9b7c0e10067759ae261b03e
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request, xml.etree.ElementTree as ET
          root=pathlib.Path('web/public/media/models'); root.mkdir(parents=True, exist_ok=True)
          base='https://raw.githubusercontent.com/lobehub/lobe-icons/'+os.environ['ICON_REV']+'/'
          names='claude google deepseek openai mistral meta qwen grok kimi bfl nvidia elevenlabs runway bytedance minimax zai gemma kling pixverse vidu'.split()
          for name in names:
              data=urllib.request.urlopen(base+'packages/static-svg/icons/'+name+'.svg',timeout=30).read()
              element=ET.fromstring(data)
              assert element.tag.endswith('svg')
              assert b'<script' not in data and b'javascript:' not in data
              (root/(name+'.svg')).write_bytes(data)
          license_dir=pathlib.Path('web/public/licenses'); license_dir.mkdir(exist_ok=True)
          (license_dir/'lobe-icons-MIT.txt').write_bytes(urllib.request.urlopen(base+'LICENSE',timeout=30).read())
          (root/'SOURCES.md').write_text('Model brand SVGs: Lobe Icons, https://github.com/lobehub/lobe-icons\nPinned revision: '+os.environ['ICON_REV']+'\nSource: packages/static-svg/icons/*.svg\nMIT license: ../../licenses/lobe-icons-MIT.txt\nGLM is represented by its provider Z.ai (zai.svg); Black Forest Labs by bfl.svg.\nBrand trademarks belong to their owners. Display identifies the corresponding model/provider, not a partnership.\n',encoding='utf-8')
          PY
      - name: Save assets on the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/media/models web/public/licenses/lobe-icons-MIT.txt
          git commit -m 'assets(web): add model brand marks with provenance and license'
          git push origin HEAD:fix/web-hero-toolbar-20261021
      - uses: actions/upload-artifact@v4
        with:
          name: model-icons
          path: |
            web/public/media/models
            web/public/licenses/lobe-icons-MIT.txt
          retention-days: 3
