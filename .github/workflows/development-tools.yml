name: Offline test tools
on:
  push:
    branches: ['feat/web-access-otp-20261019']
    paths: ['.github/workflows/development-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip download --only-binary=:all: --no-deps ruff aiogram magic-filter --dest wheels
      - uses: actions/upload-artifact@v4
        with:
          name: offline-verification-tools
          path: wheels
          retention-days: 1
