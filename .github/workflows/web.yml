name: Website checks
on:
  push:
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_GATEWAY_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Build isolated visual preview
        run: NOCLIP_STATIC_EXPORT=1 npm run build
      - name: Capture current public catalog for this review
        continue-on-error: true
        run: |
          mkdir -p research
          curl -fSL --max-time 45 https://venice.ai/models -o research/venice-models.html
      - name: Install browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/noclip-qa" playwright@1.56.1
          "$RUNNER_TEMP/noclip-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser regression tests
        run: |
          python3 -m http.server 4173 --directory out > /tmp/noclip-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/noclip-qa/node_modules" node --test tests/browser.cjs
      - name: Package review materials
        if: always()
        working-directory: .
        run: tar --exclude='web/node_modules' --exclude='web/.next' --exclude='web/*.tsbuildinfo' -czf web-review.tar.gz web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-review
          path: web-review.tar.gz
          retention-days: 2
