name: Telegram menu regression

on:
  push:
    branches: [feat/telegram-menu-simplification]
  pull_request:
    branches: [implementation/telegram-beta-complete]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Telegram menu and scoped deletion regressions
        run: pytest tests/telegram/test_simple_menu.py -v
      - name: Full regression
        run: pytest -q
